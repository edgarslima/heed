[workspace]
resolver = "3"
members = ["crates/recorder-core"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
