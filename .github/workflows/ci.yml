name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux WebKitGTK prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - run: npm ci

      # Debug Rust builds load the UI from devUrl and do not need dist/, but release
      # builds embed frontendDist at compile time. Building the frontend first keeps
      # every later Rust step valid regardless of profile.
      - run: npm run build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Create the coverage report directory
        shell: bash
        run: mkdir -p coverage
      - run: cargo llvm-cov --locked --workspace --json --output-path coverage/rust.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run coverage:gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: warn
